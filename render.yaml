# Render blueprint for the FoodFlow API (demo mode).
services:
  - type: web
    name: foodflow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: MEAL_VALUE_USD
        value: "3.0"
